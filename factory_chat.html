<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xiaoV Factory Assistant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a1a; color: #e8f0ff;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, #0d0d2b, #1a1a3e);
    padding: 16px 20px;
    border-bottom: 1px solid rgba(0,212,255,0.15);
    display: flex; align-items: center; gap: 12px;
  }
  .header h1 { font-size: 16px; color: #00d4ff; }
  .header .badge {
    background: rgba(0,255,136,0.15); color: #00ff88;
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
  }
  .chat-container {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #00d4ff; color: #0a0a1a; }
  .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid rgba(0,212,255,0.15); }
  .msg.bot .label { color: #00d4ff; font-size: 11px; margin-bottom: 4px; }
  .input-area {
    padding: 12px 16px;
    border-top: 1px solid rgba(0,212,255,0.1);
    display: flex; gap: 8px;
    background: #0d0d2b;
  }
  .input-area input {
    flex: 1; padding: 10px 14px;
    border: 1px solid rgba(0,212,255,0.2); border-radius: 6px;
    background: rgba(0,0,0,0.3); color: #e8f0ff;
    font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: #00d4ff; }
  .input-area button {
    padding: 10px 20px; border: none; border-radius: 6px;
    background: #00d4ff; color: #0a0a1a; font-weight: bold;
    cursor: pointer; font-size: 14px;
  }
  .input-area button:hover { background: #00b8e6; }
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 4px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .suggestions button {
    padding: 4px 10px; border: 1px solid rgba(0,212,255,0.2); border-radius: 12px;
    background: transparent; color: rgba(0,212,255,0.7);
    font-size: 11px; cursor: pointer;
  }
  .suggestions button:hover { background: rgba(0,212,255,0.1); }
  .status-bar {
    padding: 6px 16px; font-size: 10px; color: rgba(255,255,255,0.2);
    border-top: 1px solid rgba(255,255,255,0.04);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
<div class="header">
  <h1>🔬 xiaoV Factory查询</h1>
  <span class="badge">● 在线</span>
</div>
<div class="chat-container" id="chat"></div>
<div class="suggestions" id="suggestions">
  <button onclick="sendMsg('帮助')">💡 帮助</button>
  <button onclick="sendMsg('查车间')">🏭 查车间</button>
  <button onclick="sendMsg('查生产')">📊 查生产</button>
  <button onclick="sendMsg('查设备')">⚙️ 查设备</button>
  <button onclick="sendMsg('查配方')">📝 查配方</button>
  <button onclick="sendMsg('查库存')">📦 查库存</button>
  <button onclick="sendMsg('查数字化')">📈 查数字化</button>
</div>
<div class="input-area">
  <input id="input" placeholder="输入查询命令..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">发送</button>
</div>
<div class="status-bar">
  <span>基于真实工厂数据</span>
  <span>xiaoV Factory Bot</span>
</div>

<script>
const API = 'https://operator-identical-siren.ngrok-free.dev/dingtalk/webhook?token=xiaov_factory_2026';

async function queryBot(msg) {
  const resp = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({msgtype:'text', text:{content: msg}})
  });
  const data = await resp.json();
  return data.text?.content || '（无响应）';
}

function addMsg(content, isUser) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'user' : 'bot');
  if (!isUser) {
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = '🤖 xiaoV Assistant';
    div.appendChild(label);
  }
  const text = document.createElement('div');
  text.textContent = content;
  div.appendChild(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg(msg, true);
  const reply = await queryBot(msg);
  addMsg(reply, false);
}

function sendMsg(msg) {
  addMsg(msg, true);
  queryBot(msg).then(reply => addMsg(reply, false));
}

// 自动发送欢迎消息
window.onload = () => {
  setTimeout(() => {
    addMsg('你好！我是xiaoV Assistant 🤖\n\n当前工厂状态:\n🟢 10/10 车间运行中\n📊 3 批生产中\n\n点击下方快捷按钮或输入命令查询', false);
  }, 300);
};
</script>
</body>
</html>
