# =============================================================================
# xiaoV Factory数字化项目 — GitHub Actions CI/CD 流水线
# 触发条件：push/PR 到 main 分支
# 流程：安装依赖 → 运行测试 → Docker 构建 → Docker 推送 → SSH 部署
# =============================================================================

name: xiaoV Factory CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: xiaov-factory-bot
  CI_PROJECT_DIR: /Users/xuyan/software/hermesWorkspace

jobs:
  # ==================== 阶段一：测试 ====================
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements.txt

      - name: 运行单元测试
        run: |
          echo "🧪 xiaoV Factory数字化项目 — 自动化测试"
          echo "========================================"
          python -m py_compile factory_bot_server.py
          python -m py_compile factory_managers.py
          python distributed/test_distributed.py
        continue-on-error: false

      - name: 运行分布式系统集成测试
        run: |
          echo "📊 运行分布式系统集成测试..."
          cd distributed
          python test_distributed.py || echo "⚠️ 部分测试未通过，请检查"

  # ==================== 阶段二：Docker 构建与推送 ====================
  build-and-push:
    name: Docker 构建与推送
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 阶段三：自动部署 ====================
  deploy:
    name: 部署到生产服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            echo "🚀 xiaoV Factory — 部署开始"
            cd /opt/xiaov-factory
            git pull origin main
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d --remove-orphans
            docker system prune -f
            echo "✅ 部署完成"

      - name: 健康检查
        run: |
          echo "🔍 执行部署后健康检查..."
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}:5001/health || echo "⚠️ 健康检查失败，请手动排查"
