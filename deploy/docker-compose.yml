# =============================================================================
# xiaoV Factory数字化项目 — Docker Compose 多服务编排
# 一键部署：docker compose up -d
# =============================================================================

version: "3.8"

networks:
  factory-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  mosquitto-data:
    driver: local
  iot-data:
    driver: local

services:

  # ==================== Flask 工厂机器人服务 ====================
  flask-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: xiaov-flask-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ../iot_data.db:/data/iot_data.db
      - ../distributed/knowledge_base.db:/data/knowledge_base.db
      - ../.env:/app/.env:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - TZ=Asia/Shanghai
      - DINGTALK_TOKEN=${DINGTALK_TOKEN:-xiaov_factory_2026}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mqtt-broker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== MQTT Broker ====================
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: xiaov-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-data:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "\$SYS/broker/uptime", "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Prometheus 监控系统 ====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: xiaov-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - factory-net
    depends_on:
      - flask-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Grafana 可视化面板 ====================
  grafana:
    image: grafana/grafana:11.0.0
    container_name: xiaov-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - TZ=Asia/Shanghai
    networks:
      - factory-net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Node Exporter（主机监控） ====================
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: xiaov-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - factory-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:1.26-alpine
    container_name: xiaov-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../iot_dashboard.html:/usr/share/nginx/html/dashboard.html:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - factory-net
    depends_on:
      - flask-app
      - grafana
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
