<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xiaoV产线实时仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e8f0;font-family:'PingFang SC',sans-serif;padding:16px;height:100vh;display:flex;flex-direction:column}
.header{text-align:center;margin-bottom:16px;flex-shrink:0}
.header h1{font-size:22px;color:#00d4ff;letter-spacing:4px}
.header .sub{font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.card{background:rgba(0,20,50,0.6);border:1px solid rgba(0,212,255,0.1);border-radius:6px;padding:12px;display:flex;flex-direction:column}
.card-title{font-size:11px;color:rgba(0,212,255,0.6);margin-bottom:6px;letter-spacing:1px;flex-shrink:0}
.chart-box{flex:1;min-height:0}
.alarm-box{grid-column:1/-1;background:rgba(255,0,0,0.05);border:1px solid rgba(255,0,0,0.2);border-radius:4px;padding:8px 12px;display:none;flex-shrink:0}
.alarm-box .title{color:#ff4444;font-size:11px;margin-bottom:4px}
.alarm-box .list{font-size:10px;color:rgba(255,255,255,0.6)}
.status-bar{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.2);margin-top:8px;flex-shrink:0}
</style>
</head>
<body>
<div class="header">
  <h1>🔥 xiaoV生物反应器实时监控</h1>
  <div class="sub">模拟PLC数据采集 · 1秒刷新</div>
</div>
<div class="grid">
  <div class="card"><div class="card-title">温度 Temperature</div><div class="chart-box" id="chart1"></div></div>
  <div class="card"><div class="card-title">pH 值</div><div class="chart-box" id="chart2"></div></div>
  <div class="card"><div class="card-title">溶氧 Dissolved Oxygen</div><div class="chart-box" id="chart3"></div></div>
  <div class="card"><div class="card-title">罐压 Tank Pressure</div><div class="chart-box" id="chart4"></div></div>
  <div class="alarm-box" id="alarmBox"><div class="title">⚠️ 实时告警</div><div class="list" id="alarmList"></div></div>
</div>
<div class="status-bar">
  <span>MQTT: broker.emqx.io | Topic: keweibo/sensor/data</span>
  <span id="status">连接中...</span>
</div>

<script>
const COLORS = {temp:'#ff6b6b', ph:'#2ecc71', do:'#3498db', press:'#f39c12'}
const MAX = 30
let td = [], d1=[], d2=[], d3=[], d4=[]

function initC(id, unit, color){
  const c=echarts.init(document.getElementById(id))
  c.setOption({
    tooltip:{trigger:'axis'},
    grid:{left:'3%',right:'3%',bottom:'8%',top:'3%'},
    xAxis:{type:'category',data:[],axisLabel:{color:'rgba(255,255,255,0.2)',fontSize:9}},
    yAxis:{type:'value',name:unit,nameTextStyle:{color:'rgba(255,255,255,0.2)',fontSize:9},
           splitLine:{lineStyle:{color:'rgba(255,255,255,0.03)'}}},
    series:[{type:'line',data:[],smooth:true,symbol:'none',
             lineStyle:{color,width:2},
             areaStyle:{color,opacity:0.08}}]
  })
  return c
}
const charts = {c1:initC('chart1','°C',COLORS.temp),c2:initC('chart2','',COLORS.ph),
                c3:initC('chart3','%',COLORS.do),c4:initC('chart4','MPa',COLORS.press)}

function upd(c,t,v){
  const o=c.getOption()
  o.xAxis[0].data.push(t);o.series[0].data.push(v)
  if(o.xAxis[0].data.length>MAX){o.xAxis[0].data.shift();o.series[0].data.shift()}
  c.setOption(o)
}

setInterval(()=>{
  const t=new Date().toLocaleTimeString()
  const temp=(36+Math.random()*2).toFixed(1), ph=(6.5+Math.random()*0.5).toFixed(2),
        dO2=(75+Math.random()*20).toFixed(1), pres=(0.04+Math.random()*0.02).toFixed(3)
  upd(charts.c1,t,temp);upd(charts.c2,t,ph);upd(charts.c3,t,dO2);upd(charts.c4,t,pres)
  const alarms=[]
  if(parseFloat(temp)>38)alarms.push('温度异常: '+temp+'°C > 38°C')
  if(parseFloat(ph)<6.0)alarms.push('pH异常: '+ph+' < 6.0')
  const box=document.getElementById('alarmBox'), lst=document.getElementById('alarmList')
  if(alarms.length){box.style.display='block';lst.innerHTML=alarms.map(a=>'['+t+'] '+a).join('<br>')
  }else box.style.display='none'
  document.getElementById('status').textContent='数据更新: '+t
},1000)
</script>
</body>
</html>
