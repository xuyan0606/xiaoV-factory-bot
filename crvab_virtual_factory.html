    detail: '制粒+干燥+自动包装',
  },

// ---- 生产流程连线（车间间的物料流向） ----
const FLOWS = [
  { from: 'air',     to: 'ferment1', label: '洁净空气' },
  { from: 'ferment1', to: 'ferment2', label: '种子扩培' },
  { from: 'ferment1', to: 'extract1', label: '发酵液' },
  { from: 'ferment2', to: 'extract2', label: '发酵液' },
  { from: 'extract1', to: 'dry',      label: '浓缩液' },
  { from: 'extract1', to: 'mix',      label: '液酶' },
  { from: 'dry',      to: 'mix',      label: '酶粉' },
  { from: 'mix',      to: 'warehouse', label: '成品' },
  { from: 'extract2', to: 'warehouse', label: '成品' },
  { from: 'sewage',   to: '',         label: '排水' },
  { from: 'control',  to: 'ferment1', label: 'DCS控制' },
  { from: 'control',  to: 'extract1', label: 'DCS控制' },
  { from: 'qc',       to: 'warehouse', label: '质检放行' },
];

// ---- 全局状态 ----
let W, H;
let camAngle = 0;
let camDist = 30;
let targetAngle = 0;
let targetDist = 30;
let camHeight = 12;
let targetHeight = 12;
let isAutoRotate = true;
let mouseDown = false;
let lastMouseX, lastMouseY;
let selectedBuilding = null;
let hoveredBuilding = null;
let flowParticles = [];
let particles = [];

// ---- 缓动 ----
function lerp(a, b, t) { return a + (b-a)*t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// ---- 流粒子 ----
class FlowParticle {
  constructor(flow) {
    this.flow = flow;
    this.progress = random(1);
    this.speed = 0.003 + random(0.002);
    this.size = random(1.5, 3);
  }
  update() {
    this.progress += this.speed;
    if(this.progress > 1) this.progress = 0;
  }
  getPos() {
    let f = this.flow;
    let fromB = BUILDINGS.find(b => b.id === f.from);
    let toB  = BUILDINGS.find(b => b.id === f.to);
    if(!fromB || !toB) return null;
    let p = this.progress;
    // 弧线路径
    let x1 = fromB.x, z1 = fromB.z;
    let x2 = toB.x, z2 = toB.z;
    let mx = (x1+x2)/2, mz = (z1+z2)/2;
    let arcH = 0.8;
    let t = p;
    let x = lerp(x1, x2, t);
    let z = lerp(z1, z2, t);
    let y = sin(t * PI) * arcH + 0.5;
    return { x, y, z };
  }
}

// ---- 背景粒子 ----
class BgParticle3D {
  constructor() { this.reset(); }
  reset() {
    this.x = random(-40, 40);
    this.z = random(-40, 40);
    this.y = random(-5, 20);
    this.sz = random(0.5, 1.5);
    this.phase = random(TWO_PI);
    this.spd = random(0.01, 0.03);
  }
  update(t) {
    this.y += sin(t*0.2 + this.phase)*0.005;
    this.x += this.spd * 0.1;
    if(this.x > 45) this.x = -45;
  }
}

// ---- 坐标系转换（3D世界→屏幕） ----
function worldToScreen(wx, wy, wz) {
  // 简易透视投影
  let rot = camAngle;
  let cosA = cos(rot), sinA = sin(rot);
  let dx = wx * cosA - wz * sinA;
  let dz = wx * sinA + wz * cosA;
  let dy = wy - camHeight;
  let scale = 400 / (dz + camDist);
  let sx = W/2 + dx * scale * 8;
  let sy = H/2 - dy * scale * 8;
  return { x: sx, y: sy, s: scale };
}

// ---- 查找最近建筑（鼠标点击/悬停） ----
function getBuildingAt(mx, my) {
  let best = null, bestDist = 30;
  for(let b of BUILDINGS) {
    let cx = b.x, cz = b.z;
    let screen = worldToScreen(cx, 0, cz);
    let d = dist(mx, my, screen.x, screen.y);
    if(d < bestDist) {
      bestDist = d;
      best = b;
    }
  }
  return best;
}

// ================================================================
// SETUP
// ================================================================
function setup() {
  W = windowWidth;
  H = windowHeight;
  createCanvas(W, H, WEBGL);
  pixelDensity(1);
  colorMode(RGB, 255);
  frameRate(30);

  // 初始化流粒子
  for(let f of FLOWS) {
    if(f.to) {
      for(let i=0; i<6; i++) flowParticles.push(new FlowParticle(f));
    }
  }

  // 初始化背景粒子
  for(let i=0; i<80; i++) particles.push(new BgParticle3D());

  // 默认选中
  selectedBuilding = BUILDINGS[0];
  updatePanel(selectedBuilding);

  describe('科为博虚拟工厂 — 鼠标拖拽旋转·滚轮缩放·点击查看车间详情');
}

function draw() {
  // 背景
  background(5, 5, 16);

  // 相机控制
  if(isAutoRotate && !mouseDown) {
    targetAngle += 0.002;
  }
  camAngle = lerp(camAngle, targetAngle, 0.05);
  camDist = lerp(camDist, targetDist, 0.08);
  camHeight = lerp(camHeight, targetHeight, 0.08);

  // 设置相机
  let cx = sin(camAngle) * camDist;
  let cz = cos(camAngle) * camDist;
  camera(cx*3, camHeight*2, cz*3, 0, 0, 0, 0, 1, 0);
  ambientLight(20, 20, 40);
  directionalLight(100, 120, 180, 0.5, -1, -0.5);
  directionalLight(60, 80, 100, -0.3, 0.5, 0.3);
  pointLight(0, 100, 200, 0, 0, 10);

  // ---- 地面 ----
  push();
  noStroke();
  fill(COL.ground[0], COL.ground[1], COL.ground[2]);
  // 主地面
  push();
  translate(0, -0.05, 0);
  rotateX(-PI/2);
  fill(8, 8, 28);
  plane(45, 45);
  pop();

  // 网格（发光线条）
  stroke(COL.cyan[0], COL.cyan[1], COL.cyan[2], 15);
  strokeWeight(0.3);
  for(let i=-20; i<=20; i+=2) {
    line(i, 0, -20, i, 0, 20);
    line(-20, 0, i, 20, 0, i);
  }
  pop();

  // ---- 更新流粒子 ----
  for(let p of flowParticles) p.update();

  // ---- 绘制流程管线 ----
  push();
  for(let f of FLOWS) {
    if(!f.to) continue;
    let fromB = BUILDINGS.find(b => b.id === f.from);
    let toB = BUILDINGS.find(b => b.id === f.to);
    if(!fromB || !toB) continue;
    let fx = fromB.x, fz = fromB.z;
    let tx = toB.x, tz = toB.z;

    // 弧线管道路径
    let mx = (fx+tx)/2, mz = (fz+tz)/2;
    let arcH = 1.2;
    noFill();
    stroke(COL.cyan[0], COL.cyan[1], COL.cyan[2], 20);
    strokeWeight(0.3);

    // 绘制贝塞尔曲线
    beginShape();
    let steps = 30;
    for(let i=0; i<=steps; i++) {
      let t = i/steps;
      let x = lerp(fx, tx, t);
      let z = lerp(fz, tz, t);
      let y = sin(t * PI) * arcH;
      vertex(x, y+0.3, z);
    }
    endShape();
  }
  pop();

  // ---- 绘制流粒子 ----
  push();
  noStroke();
  for(let p of flowParticles) {
    let pos = p.getPos();
    if(!pos) continue;
    let c = COL.green;
    let pulse = 0.6 + 0.4*sin(frameCount*0.1 + p.progress*10);
    translate(pos.x, pos.y, pos.z);
    fill(c[0], c[1], c[2], 180 * pulse);
    sphere(p.size * 0.3);
    fill(c[0], c[1], c[2], 30 * pulse);
    sphere(p.size * 0.7);
    translate(-pos.x, -pos.y, -pos.z);
  }
  pop();

  // ---- 绘制建筑 ----
  for(let b of BUILDINGS) {
    drawBuilding(b);
  }

  // ---- 建筑标签（Sprite 文字） ----
  push();
  for(let b of BUILDINGS) {
    let isHover = hoveredBuilding === b;
    let isSelected = selectedBuilding === b;
    let labelY = b.h + 1.2;
    let finalY = labelY + (isHover ? 0.3 : 0);

    // 标签背景
    push();
    translate(b.x, finalY, b.z);
    noStroke();
    fill(0, 0, 0, 150);
    box(b.w*0.6, 0.3, 0.1);
    pop();

    // 标签文字（始终面向相机）
    push();
    translate(b.x, finalY, b.z);
    noStroke();
    let alpha = isHover ? 255 : isSelected ? 220 : 180;
    fill(255, 255, 255, alpha);
    textFont('PingFang SC, sans-serif');
    textSize(0.6);
    textAlign(CENTER, CENTER);
    text(b.label.replace('\n', ' '), 0, 0.05, b.w*1.5);
    pop();
  }
  pop();

  // ---- 顶部HUD ----
  drawHUD();

  // ---- 更新3D背景粒子 ----
  push();
  noStroke();
  for(let p of particles) {
    p.update(frameCount);
    fill(COL.cyan[0], COL.cyan[1], COL.cyan[2], 10);
    translate(p.x, p.y, p.z);
    sphere(p.sz * 0.1);
    translate(-p.x, -p.y, -p.z);
  }
  pop();
}

// ---- 绘制单个建筑 ----
function drawBuilding(b) {
  push();
  translate(b.x, b.h/2, b.z);

  let isHover = hoveredBuilding === b;
  let isSel = selectedBuilding === b;
  let pulse = isHover || isSel;
  let scale = pulse ? 1.04 : 1.0;
  let c = b.color;
  let bw = b.w * scale;
  let bd = b.d * scale;
  let bh = b.h * scale;

  // 建筑主体
  push();
  noStroke();

  // 发光边框
  if(isSel) {
    stroke(c[0], c[1], c[2], 60);
    strokeWeight(0.03);
    fill(c[0], c[1], c[2], 15);
    box(bw+0.1, bh+0.1, bd+0.1);
  }

  // 主墙体
  fill(c[0], c[1], c[2], 40 + (isHover ? 30 : 0));
  stroke(c[0], c[1], c[2], 60 + (isHover ? 40 : 0));
  strokeWeight(0.02);
  box(bw, bh, bd);

  // 屋顶发光线条
  if(isSel || isHover) {
    stroke(c[0], c[1], c[2], 80);
    strokeWeight(0.02);
    noFill();
    // 屋顶轮廓
    let hw = bw/2, hd = bd/2;
    beginShape();
    vertex(-hw, bh/2+0.01, -hd);
    vertex( hw, bh/2+0.01, -hd);
    vertex( hw, bh/2+0.01,  hd);
    vertex(-hw, bh/2+0.01,  hd);
    endShape(CLOSE);
  }

  // 状态指示灯
  pop();

  push();
  translate(0, bh/2+0.02, 0);
  let statusColor = b.status === '运行中' ? COL.green :
                    b.status === '建设中' ? COL.gold : COL.gray;
  noStroke();
  fill(statusColor[0], statusColor[1], statusColor[2], 150);
  sphere(0.08);
  pop();

  pop();
}

// ---- HUD ----
function drawHUD() {
  push();
  resetMatrix();
  // 左上角标题
  noStroke();
  fill(COL.white[0], COL.white[1], COL.white[2], 180);
  textFont('PingFang SC, sans-serif');
  textSize(14);
  textAlign(LEFT, TOP);
  text('科为博虚拟工厂 · VR Factory', 15, 12);

  fill(COL.gray[0], COL.gray[1], COL.gray[2], 100);
  textSize(10);
  text('拖拽旋转 · 滚轮缩放 · 点击查看详情', 15, 32);

  // 右上角统计
  let running = BUILDINGS.filter(b => b.status === '运行中').length;
  let total = BUILDINGS.length;
  textAlign(RIGHT, TOP);
  fill(COL.cyan[0], COL.cyan[1], COL.cyan[2], 150);
  textSize(11);
  text(`车间: ${running}/${total} 运行中`, W-15, 12);
  fill(COL.gray[0], COL.gray[1], COL.gray[2], 80);
  textSize(9);
  text(`料流路径: ${FLOWS.length} 条`, W-15, 28);

  pop();
}

// ---- UI 面板更新 ----
function updatePanel(b) {
  let title = document.getElementById('panelTitle');
  let info = document.getElementById('panelInfo');
  let desc = document.getElementById('panelDesc');
  let panel = document.getElementById('detailPanel');

  if(!b) { panel.classList.remove('show'); return; }

  title.textContent = b.label.replace('\n', ' ');
  let html = '';
  html += `<div class="info-row"><span class="label">状态</span><span class="value">${b.status}</span></div>`;
  html += `<div class="info-row"><span class="label">工艺</span><span class="value">${b.process}</span></div>`;
  for(let [k, v] of Object.entries(b.params)) {
    html += `<div class="info-row"><span class="label">${k}</span><span class="value">${v}</span></div>`;
  }
  info.innerHTML = html;
  desc.textContent = b.desc;
  panel.classList.add('show');
}

function hidePanel() {
  document.getElementById('detailPanel').classList.remove('show');
  selectedBuilding = null;
}

// ---- 鼠标事件 ----
function mousePressed() {
  if(mouseX < 0 || mouseX > W || mouseY < 0 || mouseY > H) return;
  // 检查是否点击到建筑
  let b = getBuildingAt(mouseX, mouseY);
  if(b) {
    selectedBuilding = b;
    updatePanel(b);
  }
  mouseDown = true;
  lastMouseX = mouseX;
  lastMouseY = mouseY;
  isAutoRotate = false;
}

function mouseReleased() {
  mouseDown = false;
  setTimeout(() => { isAutoRotate = true; }, 3000);
}

function mouseDragged() {
  if(!mouseDown) return;
  let dx = mouseX - lastMouseX;
  let dy = mouseY - lastMouseY;
  targetAngle -= dx * 0.008;
  targetHeight += dy * 0.05;
  targetHeight = clamp(targetHeight, 3, 25);
  lastMouseX = mouseX;
  lastMouseY = mouseY;
}

function mouseMoved() {
  let b = getBuildingAt(mouseX, mouseY);
  hoveredBuilding = b;

  let tip = document.getElementById('tooltip');
  if(b) {
    tip.textContent = b.label.replace('\n', ' ') + ' · ' + b.status;
    tip.style.left = (mouseX+12) + 'px';
    tip.style.top = (mouseY-8) + 'px';
    tip.classList.add('show');
  } else {
    tip.classList.remove('show');
  }
}

function mouseWheel(event) {
  targetDist += event.delta * 0.03;
  targetDist = clamp(targetDist, 8, 60);
  return false;
}

function touchStarted() {
  if(mouseX < 0 || mouseX > W || mouseY < 0 || mouseY > H) return;
  let b = getBuildingAt(mouseX, mouseY);
  if(b) {
    selectedBuilding = b;
    updatePanel(b);
  }
  mouseDown = true;
  lastMouseX = mouseX;
  lastMouseY = mouseY;
  isAutoRotate = false;
}

function touchEnded() {
  mouseDown = false;
  setTimeout(() => { isAutoRotate = true; }, 3000);
}

function windowResized() {
  W = windowWidth;
  H = windowHeight;
  resizeCanvas(W, H);
}

function keyPressed() {
  if(key === 'r' || key === 'R') {
    targetAngle = 0;
    targetDist = 30;
    targetHeight = 12;
    isAutoRotate = true;
  }
  if(key === 'f' || key === 'F') {
    let fs = fullscreen();
    fullscreen(!fs);
  }
}
</script>

</html>
